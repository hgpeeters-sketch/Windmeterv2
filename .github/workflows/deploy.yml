name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/windmeter-bluetooth-app-lIQKn, main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build StartingAppv2
        working-directory: StartingAppv2
        run: npm ci && npm run build

      - name: Prepare deploy folder
        run: |
          mkdir -p _deploy
          cp -r StartingAppv2/dist/. _deploy/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _deploy
